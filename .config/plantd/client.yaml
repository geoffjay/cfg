---
server:
  endpoint: "https://localhost:8443"  # App service endpoint
  timeout: 30s
  retries: 3

# gRPC Configuration
grpc:
  gateway_endpoint: "http://localhost:5002"  # Identity service direct gRPC endpoint
  timeout: 30s

identity:
  endpoint: "http://localhost:5002"  # Identity service direct gRPC endpoint
  default_profile: "default"
  auto_refresh: true
  cache_duration: "5m"

defaults:
  service: "org.plantd.Client"
  output_format: "json"  # json, yaml, table
  use_grpc: true

profiles:
  default:
    identity_endpoint: "http://localhost:5002"
  production:
    identity_endpoint: "https://production:5002"
  staging:
    identity_endpoint: "https://staging:5002"
